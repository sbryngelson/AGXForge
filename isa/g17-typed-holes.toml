# TYPED HOLES: every opcode this corpus contains that has no recovered semantic ROLE.
#
# The mission's rule is that an unknown instruction stays a typed hole rather than acquiring a
# guessed name. This file is that set stated precisely, and each entry now carries THREE kinds of
# fact, none of them a guess:
#
#   1. WHAT APPLE DECLARES - NumDefs, scheduling class, TSFlags, operand class signature.
#   2. WHETHER IT CAN BE CONSTRUCTED - residual_bits is the number of varying bits not attributed
#      to an operand. Zero means the form is FULLY DECODED and a composer can build it from its
#      operands alone; what is missing is a name, not an encoding.
#   3. WHERE IT SITS IN THE DATAFLOW GRAPH - measured over the corpus by def-use, not inferred.
#      "address: 97% of its consumers are loads or stores" is a measurement of op612's position;
#      it is not a claim that op612 computes an address.
#
# 133 opcodes and 11598 instructions are fully decoded with an unknown role; 16 opcodes and 1629
# instructions are neither named nor fully decoded, and those are the only ones where a composer
# would have to inherit template state it cannot account for.
#
# A scheduling class groups opcodes by how Apple's scheduler treats them and TSFlags is a bitfield
# of target properties; neither is a semantics. Generated from isa/g17-opcodes.toml, the corpus
# walk, and tools/g17layout.py.
#
# residual_bits > 0 entries now carry a [[hole.residual]] block per bit: the byte and bit, the
# form it was measured in, the DOMINANT value, and how many of that form's instances carry the
# other one. A composer that emits the dominant value everywhere is making a stated assumption
# with a counted cost - 911 instruction-bits across these 16 opcodes - rather than inheriting a
# template it cannot account for. That is the difference between an unexamined constant and a
# measured one, and this project has already paid once for confusing them.


