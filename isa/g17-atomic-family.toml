# THE ATOMIC FAMILY. Everything a backend needs to SELECT and AUTHOR an atomic on G17.
#
# The shape of the answer is the point: the atomic OPERATION is not the opcode. It is a four-bit
# code in the same four bit positions in every member of the family, and the opcode encodes the
# operand SHAPE - whether a result comes back, whether the address is device or threadgroup,
# whether an index register is present, how wide the value is.
#
# Evidence is stated per table. Nothing here is inferred from frequency.
title = "G17 atomics: the operation code table, the structural axes, and what the decoder will not admit"
date = "2026-09-05"

[family]
text = """
208 opcodes share (schedclass, tsflags) with op10094 in Apple's MCInstrDesc:

    schedclass 286 or 287, tsflags 0x402002400     device-scope
    schedclass 329,        tsflags 0x402002800     threadgroup-scope

Their operand lists are one skeleton with parts present or absent:

    [dest]  imm imm  [address]  imm  [index]  imm imm imm  [value]  imm

Five occur in this corpus - op10023, op10094, op10095, op11701, op11765 - and 29 are reachable
from a single op10094 encoding by flipping bits, which certifies them as encodable rather than
merely declared.
"""

# ---------------------------------------------------------------------------------------------
# THE OPERATION. Four bits, one table, identical in op10094, op10095, op10022 and op10023.
[operation]
bits = ["b4[5]", "b5[3]", "b6[3]", "b7[7]"]
evidence = """
Established by sweeping all sixteen combinations through Apple's decoder and reading operand 2,
which the decoder prints as 0x40200 + code. The POSITIVE CONTROL is that the table reproduces all
ten encodings Apple's own compiler emits, for atomic_fetch_{add,sub,and,or,min,max} on both
signednesses, atomic_exchange and atomic_fetch_xor - ten of ten, no exceptions.

Eleven of the sixteen combinations are op10094; one is op10095; four do not decode.
"""
# b4[5] b5[3] b6[3] b7[7] -> code, meaning, encoded length
table = [
  "0 0 0 0 ->  0  add        10 bytes",
  "1 1 0 1 ->  1  sub        12 bytes",
  "0 1 1 1 ->  2  exchange   12 bytes",
  "0 1 0 0 ->  3  cmpxchg    10 bytes  SELECTS THE SIBLING OPCODE, op10094 -> op10095",
  "1 0 1 1 ->  4  umin       12 bytes",
  "1 0 1 0 ->  5  smin       10 bytes",
  "0 0 1 1 ->  6  umax       12 bytes",
  "0 0 1 0 ->  7  smax       10 bytes",
  "1 0 0 0 ->  8  and        10 bytes",
  "0 1 1 0 ->  9  or         10 bytes",
  "1 1 1 1 -> 10  xor        12 bytes",
  "1 1 0 0 -> 12  fadd32 (hardware-tested normal values)  10 bytes; not emitted by tested Metal builtins",
  "1 1 1 0 -> BAD",
  "0 0 0 1 -> BAD",
  "1 0 0 1 -> BAD",
  "0 1 0 1 -> BAD",
]

[operation.code_12_float_add_beyond_metal]
text = """
Code 12 decodes cleanly as op10094 and no Metal source construct in the tested corpus produces it.
Pure IOGPU submissions execute the same 10-byte atomic with authored value bits 0x3F800000
(1.0f): initial A[0]=1.0f yields returned old values 1.0f and 2.0f and final 3.0f; initial
A[0]=-1.0f yields returned old values -1.0f and 0.0f and final 1.0f. Each case reproduced
twice. This identifies floating-point atomic addition for these normal values. Earlier initial
and value bit patterns 5, 37, 32, and 33 left zero, while a zero operand preserved normal
values, consistent with subnormal flushing. One-ULP additions at 1.0f advanced exactly one
ULP per group. Half-ULP ties from even and odd mantissas followed round-to-nearest-even for
each update. Boundary trials show the tested largest subnormal shared input and value
operand treated as zero during arithmetic, even though the raw old shared input is returned;
cancellation of two normal inputs flushed a smallest-subnormal result to zero before the next
atomic update. Each boundary case reproduced twice. Special-value controls with the existing
zero/1.0f streams returned raw -0 then wrote +0; preserved +infinity and -infinity under
addition of 1.0f; and returned quiet-NaN payload 0x7FC12345 before writing canonical
0x7FC00000. Each reproduced twice. Other subnormal values, signaling NaNs, other NaN payloads,
opposite-sign infinity cancellation, other signed-zero pairs, and other rounding regimes remain
to be measured (docs/g17-first-dispatch-trials.md, uniform code-12 trial).
"""

