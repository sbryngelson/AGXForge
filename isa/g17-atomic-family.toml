[operation.cmpxchg_is_a_separate_opcode_for_a_reason]
text = """
Code 3 changes the opcode - op10094 to op10095, op10022 to op10023 - because compare-exchange
needs a PAIR where the others need a single value: op10094's operand 8 is a GPR32 and op10095's is
a GPR32tup2, the new value and the compared value together. LLVM cannot vary an operand class
within one opcode, so it splits. The four operation bits are unchanged.
"""

# ---------------------------------------------------------------------------------------------
[axes]
evidence = """
Each bit below was flipped on a compiled op10094 and the resulting opcode read from Apple's
decoder, then confirmed by sweeping all 64 combinations of the six. 44 of 64 decode.
"""
"b4[0]" = "1 returns the old value (ndefs=1), 0 discards it. op10094 <-> op10022."
"b4[1]" = "1 threadgroup address (GPR16), 0 device address (GPR32tup2). op10094 <-> op11769."
"b4[6]" = "1 widens the value operand to GPR32tup2. In this corner it also forces the no-result form: with b4[6]=1, b4[0] has no effect."
"b5[1]" = "forces the index-register form on, overriding b5[2]."
"b5[2]" = "1 no index operand - address from the base alone. 0 adds an index register, GPR32 for device and GPR16 for threadgroup. op10094 <-> op10090."
"b8[5]" = "1 selects the form with two extra leading immediates and no result. op10094 <-> op10070."
"b6[2]" = "1 leaves the atomic family entirely - op10094 becomes op17235, an ordinary store."

[axes.byte0_is_the_format_class]
text = """
byte0's low three bits select the instruction format, not the operation. Sweeping all 256 values
on an op10094 base gives twelve distinct outcomes and only byte0 & 7 == 7 stays in the atomic
family; the other values land on unrelated opcodes at 2, 4 or 8 bytes. The remaining bits of byte0
carry destination register bits.
"""

# ---------------------------------------------------------------------------------------------
[what_the_decoder_will_not_admit]
status = "NEGATIVE, with the search that failed stated in full"
text = """
179 of the 208 declared opcodes were never produced by any of these:

    single-bit walk to saturation from a 12-byte base       29 reached, then 0 new
    the same from a 16-byte base, so longer forms fit       29 reached, then 0 new
    132,240 two-bit mutations from all 29                   0 new
    1,365,504 three-bit mutations from four bases           0 new
    400,000 random 16-byte encodings, byte0 & 7 == 7        21 produced, all inside the 29
    400,000 random encodings, byte0 UNRESTRICTED            12 produced, all inside the 29

The boundary is exact and it is the WIDTH axis. Everything reached has a scalar destination -
GPR32 or none - and a GPR32 or GPR32tup2 value. Everything unreached has a wider destination
(GPR32tup2/3/4, plain or _shifted) or a wider value (GPR32tup3/4/6/8).

The honest reading is that MCInstrDesc is shared across AGX3 subtargets and declares more than
the g17s decoder admits, OR that the width axis needs a mode this project has not found. Either
way it is a typed hole with a known shape rather than an unexplored region: a composer should not
emit those opcodes, because nothing here can round-trip them.

The random sweeps are not weak evidence. The unrestricted one decoded 40,897 of 400,000 draws
into 1,492 distinct opcodes, so the instrument does explore; it simply never lands there.
"""

[selection_for_a_backend]
text = """
To author `atomic_fetch_OP(&p[i], v)`:

  1. Pick the opcode from the shape - result wanted or not, device or threadgroup, index register
     present or not, value width. The five corpus members and the 29 certified-encodable members
     are in tools/g17slice.py and the reach table.
  2. Write the four operation bits from the code table. They do not move between opcodes.
  3. Everything else is the ordinary memory-operand model: the address is a GPR32tup2 for device
     and a GPR16 for threadgroup, and it is the SAME operand index in both directions.

Memory ORDER is not encoded. Metal rejects memory_order_seq_cst and memory_order_acq_rel on
device atomics on this target, so relaxed is the only ordering the compiler can express and no
field varies with it.

atomic_load_explicit does not use this family at all - it lowers to an ordinary load, op12688.
atomic_store_explicit lowers to op10022 carrying the EXCHANGE code with the result discarded.
"""

[operation.the_per_lane_form_op10090_has_its_own_eight_unassigned_codes]
text = """
CLASSIFIED 2026-09-23 (Set C item 4), decode-side, no dispatch. The table above is op10094's, the
UNIFORM-address device atomic, whose operation field is b4[5] b5[3] b6[3] b7[7]. The PER-LANE device
atomic op10090 (isa/g17-atomic-semantics.json, tools/g17atomicprobe.py) carries its operation in a
DIFFERENT field - b4[5] b5[3] b6[3] b11[4] - and Apple's compiler reaches only EIGHT of its sixteen
codes (0, 1, 6, 11, 12, 13, 14, 15). So op10094 and op10090 are not in disagreement about "how many
codes"; they are two opcodes with two field placements. Sweeping op10090's eight UNASSIGNED codes
(2, 3, 4, 5, 7, 8, 9, 10) through the decoder from an add witness classifies them, exactly as code
12 was classified for op10094:

    code 2       -> op10091, a SIBLING opcode      the per-lane compare-exchange, the same
                                                   split cmpxchg forces on op10094 -> op10095
    codes 3,4,5  -> op10090, 12 bytes, no builtin  three authorable TYPED HOLES; each is a valid
                                                   encoding with no Metal source construct, and
                                                   naming them needs execution, not this decoder
    codes 7,8,9,10 -> do not decode                BAD, like op10094's four BAD combinations

So the "eight unassigned operation codes" of the per-lane form are one sibling selector, three
authorable-but-unnamed holes, and four invalid encodings - not eight unknown functions. The only
open semantic question is what codes 3, 4 and 5 compute, which is an execution question.

CORRECTED 2026-09-23: the "codes 3, 4, 5 are holes" line above is WRONG, and no execution is needed
to see it. It was read off ONE witness's field convention - the 12-byte op10090 in
isa/g17-atomic-semantics.json, whose fourth operation bit is b11[4]. But cc EMITS op10090 with the
operation in b4[5] b5[3] b6[3] (three bits, the fourth appearing only for the wider forms), and
decoding cc's own output gives add=0, and=1, sub=3, max=4, min=5, or=6, xor=7 (sub and xor are
12-byte, add/and/max/min/or 10-byte), matching ir.Builder.ATOMIC_OPS. So in the encoding this
backend actually uses, codes 3/4/5 are sub/max/min - ASSIGNED operations, not holes; dispatching
