# THE SELECTOR FIELD. byte1[5:0] of op14059 and op14060 is a 6-bit code naming the special
# register, and it is neither the MCRegister id nor the SIR32 class index. It is single-valued
# per register in all 1858 instances of the two opcodes and consistent between them, with no
# conflict. The numbering is systematic - the three grid-size registers are consecutive, so are
# the three threadgroup-position ones, and so are the three thread-position-in-grid ones - which
# is what an architectural encoding looks like and not what an allocation looks like.
#
# op14059 and op14060 are the ONLY opcodes in Apple's tables that declare a SIR32 operand, so
# this is the whole read_sr surface as far as the corpus reaches. Codes not listed are not
# assigned here: the corpus reads 15 of the 66 SR_* names and the rest have no observed code.

[selector]
field = "byte1[5:0]"
opcodes = [14059, 14060]
instances = 1858

