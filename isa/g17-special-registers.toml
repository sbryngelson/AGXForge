# Special registers: every non-general register Apple's MCRegisterInfo defines for AGX3,
# and which of them this corpus actually reads. Names are Apple's own, recovered from the
# register string table; they survived the strip that removed instruction names.
#
# For the codegen peer the load-bearing fact is that flags are an allocatable resource with
# pressure, not a single condition code. CORRECTED 2026-09-04: this file first said there are
# SEVEN, FLAG0..FLAG6, which was read off the registers this corpus USES. Apple's FLAGwritable
# class lists FIFTEEN - FLAG0 through FLAG14 - and FLAGR adds FLAGTRUE and FLAGFALSE to them.
# Only FLAG0..FLAG5 are read here, so seven was a property of the sample and the class member
# list is the authority. tools/agx3meta members dumps it.
#
# FLAGTRUE and FLAGFALSE are constants rather than allocatable: they appear only as sources,
# and op575 reading FLAGTRUE is how an unconditional region is expressed.
#
# THE ENCODING is a compact 3-bit index and NOT the class index: FLAGn encodes as n, and 6
# encodes FLAGTRUE, which sits at class index 15. Eight opcodes carry it, in different bit
# positions each - see ledger/g17-byte1-is-the-relocated-base-register.toml. Three bits is also
# why only FLAG0..FLAG6 are reachable in these forms whatever the class declares.
#
# Reads are counted over decoded operands, so they are structural. Nothing here is executed.

[meta]
chip = "H17s"
arch = "applegpu_g17s"
objects_scanned = 679
special_registers_defined = 200
read_by_corpus = 26
sr_registers_defined = 66

