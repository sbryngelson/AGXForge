# --- the compare-immediate form used when the operand is a register ---------------------------
[[instruction]]
name = "cmp.imm.split"
example = "0a 03  +  2a 84  +  04 22"
size = 6
confidence = "causal + executed"
note = """Three 2-byte instructions producing a predicate. Distinct from cmp.pair.imm above, which
is the 4+2 class-3 form the compiler uses when the operand is a freshly loaded value; this one
appears whenever the operand is already in a register.

The compiler NEVER emits >= or <=: `x >= K` comes out as `x > K-1` and `x <= K` as `x < K+1`, so
the relation field only ever holds two values.

Followed by `1e 00 00 0e`, which writes the EXEC MASK from the predicate - the conditional is
predication, not branching. ledger/g17-exec-mask-is-the-conditional.toml"""

[instruction.fields.reg]
expr = "cmpsrc_byte1[7:1]"
confidence = "executed"
note = """The compared register, in the FIRST of the three instructions: 0a <(reg<<1)|1>. Read out
of eight compilations against the producing instruction's own decoded destination, then executed:
with r1 holding tp.x and r0 holding a stale tg.x, `0a 03` and `0a 01` give branch thresholds of
gw >= 22 and gw >= 43, both exact over twelve grid sizes.

NOT byte3 of the pair, which is where I looked first - that is constant at 0x02 across r0, r1,
r2, r3 and r5."""

[instruction.fields.imm]
expr = "cmp_byte0[4]<<7 | (cmp_byte1 & 0x7e) | rel_byte0[4]"
confidence = "causal + executed"
note = """Eight bits split three ways, with the LOW BIT in the relation instruction. 22 compiler
outputs reproduced exactly over K = 1..255 and all four relations; 128 dispatches over 8 variants
x 16 threadgroup widths, each predicting the exact width at which behaviour changes. One of the
executed variants, `2a 90` + `14 22`, is a combination the compiler emits nowhere."""

[instruction.fields.rel]
expr = "rel_byte0[3:0]"
confidence = "causal + executed"
note = "0x4 unsigned >, 0x5 unsigned <. 0x6 appears for signed compares and is NOT resolved - its immediate byte has bit7 clear, so the field layout differs and it was not pursued."

[instruction.fields.byte3]
expr = "unresolved"
confidence = "unresolved"
note = """0x22 when the operand came from read_sr, 0x02 when it came from an ALU result. Real, not
noise - but it is not the register and its meaning is unrecovered, so the compiler inherits it."""

[instruction.hazard]
note = """LOAD-USE. Pointing the compare at a register whose load has not landed makes it read the
register's PREVIOUS contents; measured over eight data values, all wrong in the same way. The
compare's wait mechanism is unlocated, so the compiler refuses a load operand."""

