# Machine-readable G17 SCALAR subset, recovered on H17s / applegpu_g17s (M5 Pro).
# Companion to isa/tensor-isa.toml. Every field carries a confidence class so that code
# generation and documentation cannot drift apart:
#   causal      mutating the field changed hardware behaviour as predicted
#   structural  constant across all observed encodings; carried through, not understood
#   context     meaning depends on other bytes (sub-form or coupled codeword)
#   unresolved  measured to matter, not explained

[meta]
chip = "H17s"
arch = "applegpu_g17s"
probe = "spike/accel/re/dst_map.py - tensor-bearing kernel, ten-plus named live registers"
note = """A scalar-only kernel is recompiled from AIR; native code executes only when the
kernel also contains a tensor op. Every probe here therefore carries a matmul2d, and the
positive control is that disabling all accelerator issues zeroes the tensor tile."""

[[instruction]]
name = "alu.add.imm"
example = "27 01 04 3a 2d 00 a3 02 a0 80 01 00"
size = 12
confidence = "causal"
# byte0's LOW NIBBLE is 7 or f for the same family: an address add with byte0=0x3f decodes,
# round-trips and authors identically to a byte0=0x37 one. Treat (byte0 & 0xF) in (7, 0xf)
# as one form, as tools/agxdis already did.

[instruction.fields.dest]
expr = "byte0[4] + 2*byte7[3] + 4*byte7[4]"
confidence = "causal"
note = "All 8 values enumerated; 7 confirmed by clobbering a named register, the 8th is stock."

[instruction.fields.src1]
expr = "2*byte9[2:0] + byte8[7]"
confidence = "causal"
note = "Validated on six instructions whose source register is known independently (r0..r5)."

[instruction.fields.operand_b_mode]
expr = "byte4[2]: 1 = immediate, 0 = register   (byte4[3] is NOT part of this field)"
confidence = "causal"
note = """THE SECOND OPERAND IS ONE SLOT IN byte1 AND byte3, read either as an immediate or as a
register index. byte4 selects which. This is why the immediate field and the register-index field
appeared to overlap: they are the same bits.

Authored in both directions, each with the other fields held fixed:

  byte4 0x29 -> 0x25 on a register-operand add, with imm 10 encoded in byte1/byte3
      converts x + y into x + 10, measured 17 with x = 7            immediate takes effect
  byte4 left 0x29, same imm bits (byte3 0x5a, byte1 0x02)
      read as register index 4*1 + 2*0 + 1 = r5, unallocated
      measured 7 = x + 0, and the untouched consumer gave 14        immediate ignored
  byte4 0x25 -> 0x29 on the consumer with imm 20 encoded
      read as register index 4*1 + 2*1 + 0 = r6, unallocated
      measured 17 = 17 + 0                                          immediate ignored

The compiler's own choices agree: 0x25 on every add-immediate, 0x29 on the register-register add
x + y, whose operand index decodes as 1 = the register holding y.

NARROWED 2026-09-04, same day. This was first recorded as the two-bit byte4[3:2]. It is ONE bit.
byte4[3] is the liveness marker already known to be causally inert
(ledger/g17-byte4-liveness-metadata.toml), and reading the two together conflated an operand
selector with metadata. The full 2x2, authored on the dep4 consumer with rA = 17:

    byte4  bit2 bit3   measured out[110]
    0x25    1    0        37    immediate 20 applied
    0x2d    1    1        37    immediate 20 applied
    0x29    0    1        17    register mode, reads an unallocated index
    0x21    0    0        17    register mode, reads an unallocated index

bit3 changes nothing in either column, which is also why the earlier L0 control - clearing byte4[3]
on dep2's producer - was inert. That inertness needed no separate explanation after all.

The corpus agrees the field is one bit: byte4 takes 0x21, 0x25, 0x29, 0x2d and 0x08 among its
commonest values, and grouping by bit2 alone splits them into 23931 register-mode and 6257
immediate-mode instructions."""

[instruction.fields.src2_imm]
expr = "byte1[1:0] | byte3[7:5]<<2 | byte5[7]<<5 | byte8[1:0]<<6   (when operand_b_mode = immediate)"
confidence = "causal"
note = """8-bit immediate; every bit confirmed by the resulting value change. Only read as an
immediate when byte4 selects immediate mode - see operand_b_mode.

byte8[5] additionally gates it: clearing it on an authored consumer, byte8 0xa0 -> 0x80, made the
result rA + 0 instead of rA + 20. Whether byte8[5] is part of the same mode field or a separate
enable is not established."""

[instruction.fields.src2_reg]
expr = "8*byte3[7] + 4*byte3[6] + 2*byte3[5] + byte1[1]   (when operand_b_mode = register)"
confidence = "causal"
note = """The same register index recovered for alu.shift.imm, in the same bits, which settles the
cross-family question left open earlier that day: byte3[6] is causal in BOTH families. Two
unallocated-register readings, r5 and r6, were predicted and measured as zero contributions.

WIDENED to FOUR bits 2026-09-04. byte3[7] is the high bit, making this the same width as dest and
src1. Authored on the dep4 consumer in register mode, reading index 1 = rA = 17:

    byte3 0x1a, bit7 = 0   index 1   out[110] = 34 = 17 + 17     preregistered 34
    byte3 0x9a, bit7 = 1   index 9   out[110] = 17 = 17 +  0     index 9 unallocated

The second cell also restored out[100] to 17, because index 9 does not consume r1 - see the
lifetime field byte10[5]."""

[instruction.fields.src2_lifetime]
expr = "byte10[5]: 1 = the SRC1-slot register is released after this read, 0 = it survives"
confidence = "causal"
note = """Reading a register does not by itself destroy it; this bit decides. Authored in BOTH
directions across two independent kernels, with rA = x + 10 = 17 and rB = rA + 20 = 37:

    chain kernel   byte10 0x21 -> 0x01   out = [ 0, 37] -> [17, 37]   preregistered [17, 37]
    dep4  kernel   byte10 0x01 -> 0x21   out = [17, 37] -> [ 0, 37]   preregistered [ 0, 37]

In both, the dependent value 37 is unchanged: the consumer reads the correct operand either way,
and only the producer's survival to the later store differs. That is what makes this a lifetime
bit rather than an operand bit.

SCOPE. All four cells use IMMEDIATE operand-b mode, so the only register the consumer reads is the
src1 slot. The bit is therefore established for src1 and is NOT established for the operand-b
register. A separate observation shows operand-b reads can also release a register: a register-mode
consumer reading index 1 measured out[100] = 0 with byte10[5] ALREADY CLEAR, so whatever governs
that slot is a different control and is unresolved.

FAILED PREDICTION, kept - and now EXPLAINED. byte8[3] was predicted to be src1's lifetime bit by
symmetry - it is the largest unexplained bit in the scalar ALU family at 4240 instructions, and
g17asm's VARIABLE set already flagged it as varying with operand routing. Setting it on the dep4
consumer, byte8 0xa0 -> 0xa8, preregistered [0, 37] and measured [17, 37]: completely inert at
that site. Symmetry was not evidence.

SUPERSEDED 2026-09-04: byte8[3] is operand B's WIDTH, 1 = 32-bit - see operand_width below. The
old evidence is now fully explained rather than merely set aside. The dep4 consumer takes an
immediate operand B, and widening the declaration of an immediate that already fits changes
nothing the hardware does, so inertness at that site is exactly what the width reading predicts.
That is also why mutation could never have found this bit and a compiler differential could:
it is structural, and structural fields do not announce themselves under mutation."""

[instruction.fields.operand_width]
expr = "byte9[7] = src1 is 32-bit; byte8[3] = operand B is 32-bit; byte3[1] = DEST is 32-bit"
# NORMALISED to the mission's taxonomy 2026-09-04. This one label covered THREE fields with two
# different standings, which no single taxonomy value can express. The standing per field is:
#   byte3[1] dest width       causal      (truncation proven)
#   byte9[7] src1 width       structural  (controlled differential, never executed)
#   byte8[3] operand B width  structural  (same)
# Kept as one entry because the three are one encoding decision, with the split stated here.
confidence = "causal"
confidence_per_bit = "byte3[1] causal; byte9[7] structural; byte8[3] structural"
note = """The two largest causes of ENCODE failure in the corpus: byte9[7] differed in 54.6% of
alu.12 re-encodes and byte8[3] in 37.5%, and 58% of all failures were one or two bits. Modelling
them took alu.12 from 10.9% to 50.9% byte-exact and the corpus from 3.6% to 8.7%.

Neither is predicted by src1, the opcode, the operand mode, byte2, or by each other, and all four
combinations occur (13.6 / 16.2 / 30.9 / 39.3 percent). Both are inert at the two sites where
inertness was measured, so they had to be recovered by CONTROLLED DIFFERENTIAL rather than by
mutation - which is the general lesson: a structural field is invisible to the instrument that
finds causal ones.

Within ONE kernel, register allocation and prologue held fixed (spike/accel/re/widthbit.py):

    uint   c = u[i] + u[i+1]     32-bit int add    (byte9[7], byte8[3]) = (1, 1)
    ushort a = s[i] + s[i+1]     16-bit int add                         = (0, 0)

The mixed cells are what separate two independent operand-width bits from a single op-width
field, and both were preregistered and hit (spike/accel/re/immwidth.py):

    uint   c = u[i] + 5u         32-bit src1, immediate operand B       = (1, 0)
    uint   c = (uint)s[i] + u[i] 16-bit src1, 32-bit register operand B = (0, 1)

Corpus support: operand B is a register in 82% of instructions with byte8[3] set but only 9% of
those with it clear - the correlation "operand B is a register" gets, and the residue is what the
width reading predicts, namely 16-bit registers and 32-bit immediates.

DESTINATION added 2026-09-04, completing the triple. byte3[1] was the third largest cause of
ENCODE failure on Apple's shaders, 37.8% of alu.12, and the model never wrote it. The decisive
cells hold SOURCE width fixed and vary only the destination, in one kernel, distinguished by
opcode so neither instruction can be mistaken for the other:

    uint   wide   = (uint)s[i] * (uint)s[i+1]     MUL  src1 16-bit  dest 32-bit  byte3 = 0x3a
    ushort narrow = (ushort)u[i] + (ushort)u[i+1] ADD  src1 16-bit  dest 16-bit  byte3 = 0x18

Both preregistered and both hit. Corroborated by three cells already in hand from probes built
for other questions: 32-bit dest with 32-bit sources gives 1, 16-bit dest with 16-bit sources
gives 0, and (uint)s[i] + u[i] - a 32-bit destination with a 16-bit src1 - gives 1, which
separates destination from source in the opposite direction.

Effect on Apple's driver shaders: alu.12 9.3% -> 13.3% byte-exact, corpus 2.9% -> 3.4%.

CAUSAL, 2026-09-04, with a preregistered prediction of an unseen value. a = 0x12345 and b = 1, so
a + b = 0x12346, which does not fit in 16 bits:

    baseline        byte3 = 0x1a, dest_w = 1    out[100] = 0x12346
    byte3 -> 0x18   dest_w = 0                  out[100] = 0x2346    truncated to the low half

Predicted 0x2346 before running; measured 0x2346. A second, untouched store held 0x369cf in both
cells, so the mutation is localised to the instruction changed. dest_w is therefore causal, not
merely structural - forcing a 16-bit destination narrows the value the instruction writes.

The two SOURCE width bits remain structural: they are inert under mutation by construction,
because declaring a narrower source that already fits changes nothing the hardware does.

UNEXPLAINED CELL, kept. 'uint c = u[i] + 70000u' measured (0, 1) where the reading predicts
(1, 1): the optimiser materialised the constant into a register, which accounts for the operand-B
half, but src1 is the loaded uint and should be 32-bit. Its sibling '+ 4000u' measured (1, 1) as
predicted after the same materialisation. One cell of six is unaccounted for."""

# A NARROW NAMED FORM, deliberately not filed under generic class-2 semantics. The evidence
# covers one 32-bit integer compare subfamily - the 8-byte class-c with byte2 0x80 (compare) or
# 0x82 (min/max) - and nothing wider. Corpus class-2 is dominated by other subforms entirely
# (byte0/byte1 pairs 22 c0, 22 a0, 82 80, 42 0f), which this does NOT model.
[instruction.forms.cmp_i32_ordering]
carrier = "8-byte class-c, byte2 = 0x80 compare / 0x82 min-max"
relation_base = "eq, lt, gt - the hardware carries three relations and a complement, not six"
negate = "byte6[0]: 0 for eq, lt, gt and 1 for ne, le, ge (ne = !eq, ge = !lt, le = !gt)"
unsigned = "byte7[5]: set for unsigned lt/le/gt/ge/min/max, clear for their signed counterparts"
confidence = "structural (controlled differential, 12/12 across both signednesses)"
note = """eq and ne encode identically in both signednesses, which is the invariant worth
emphasising: equality does not depend on how operands are ordered, and the reading gets that
right without having been fitted to it.

NOT APPLICABLE, not a failed generalisation: float and ushort comparisons emit no 8-byte class-c
at all, so the preregistered negate-bit test over those types returned 0 matched and 0 missed.
Those comparisons use an instruction that has not been located.
ledger/g17-comparison-operation-field.toml"""

# THE ALU OPCODE. byte6 takes 0xa0..0xaf; this is the map recovered by sweeping thirty Metal
# expressions with runtime-loaded operands so nothing folds (spike/accel/re/opmap.py).
[instruction.forms.alu_opcode]
expr = "byte6, low nibble selects the operation"
confidence = "structural (controlled differential, one operation varied per kernel)"
note = """
    0xa0   a * b - c        multiply-subtract
    0xa1   a * b            multiply; also the multiply inside mad, a*b+c
    0xa2   operandB - src1  SUBTRACT, and the operand order is that way round - measured by
                           authoring it: a compiled ADD at a site with a = 5 and b = 7 was
                           rewritten to op = 2 and computed 2, not -2. Also abs, negate and
                           rotate, which lower through it.
    0xa3   a + b            add; also addsat, insert_bits, hadd, rhadd
    0xa9   mulhi(a, b)      high half; also reverse_bits
    0xaa   popcount
    0xab   clz
    0xae  and  0xaf        the division and modulo lowering sequence; a / b emits
                           af af a1 af ae af ae a9 a1
    0xa4, 0xa7, 0xac, 0xad, 0xa8   NOT REACHED by any expression tried

Distribution matters as much as coverage. byte6 = 0xa3 is 83.1% of MY alu.12 and only 42.1% of
Apple's, while 0xa2 is 20.8% of Apple's and was 0.9% of mine before this sweep. A probe repertoire
skewed like that makes the ENCODE gate measure the wrong thing and makes bit-level differentials
fail for reasons that have nothing to do with the bit - see
ledger/g17-byte8-bit6-unresolved.toml, where four hypotheses failed in a row because the bit is
concentrated in operations no probe emitted.

0xa8 remains unreached and is 5.5% of Apple's alu.12."""

[instruction.fields.op]
expr = "byte10"
confidence = "context-dependent"
note = "0x21 and 0x01 both seen for add, 0x24 for multiply; also gates the length extension."

[instruction.fields.mode]
expr = "byte4[2]"
confidence = "causal"
note = "Changes the VALUE computed, not the destination: t 6 -> 1 with the victim unchanged."

[instruction.fields.dest_high]
expr = "byte0[7]"
confidence = "causal"
note = """RESOLVED 2026-09-03: byte0[7] is the weight-8 destination bit, so this form reaches
r0..r15. Proof came from the store side rather than from a sweep: an add whose byte0 is 0xa7
decodes as dest r0 under the low bits alone, yet its value appears in the slot that a
4-component store starting at r5 writes fourth - i.e. r8. The earlier LEAD below predicted
exactly this. byte7[5] is NOT weight 8 - setting it produces no write at all. Original note: of six same-form adds in one kernel, the only one with byte0[7]
set is also the only one whose destination decodes to r0, which would clobber the live source and
cannot be right - so byte0[7] is a candidate high destination bit. Untested."""

[instruction.fields.liveness]
expr = "byte4[3]"
confidence = "structural"
note = """Set by the compiler exactly when the result feeds a later ALU instruction (31/31 across
add, shift, register-register add and multiply producers), but CAUSALLY INERT: clearing it on a
producer whose result is forwarded leaves the forwarded value unchanged, with a positive control
proving that same instruction is patchable. Compiler scheduling metadata, not architectural
state. A backend should derive it from liveness; nothing depends on it."""

# Encoding an instruction of this form requires a TEMPLATE of the same sub-form: the semantic
# fields own only the bits in tools/g17asm.py OWNED_ADD, and every other bit is structural.
# An encoder that zeroes unknown bits emits instructions that DECODE correctly and misexecute.
# Gate every authored instruction on the byte-exact round trip before dispatching it.

[forwarding]
rule = "ALU results forward immediately; no minimum producer-consumer separation"
confidence = "causal"
note = """An authored dependent pair is exact at 0, 1 and 2 intervening instructions, adjacent
included (r7 = r0 + 10; r6 = r7 + 20 with r0=7 gives 17 and 37). No filler, spacing, scoreboard
or wait encoding is needed, so an assembler may chain these ALU operations directly."""

[[instruction]]
name = "mov.imm.short"
example = "04 2a"
size = 2
confidence = "causal"

[instruction.fields.imm]
expr = "byte1"
confidence = "causal"
note = "Small immediates only; 200 already needs the wide form."

[[instruction]]
name = "mov.imm.wide"
example = "0c ef 02 de 1a 0c 6d 05"
size = 8
confidence = "causal"

[instruction.fields.imm]
expr = "byte1[6:0] | byte4[4:1]<<7 | byte5[3:2]<<11 | byte6[7:0]<<13 | byte7[3:0]<<21 | byte3[7:1]<<25"
confidence = "causal"
note = "Full 32 bits. Verified byte-exact on 0xDEADBEEF and 0x12345678, both preregistered."

[[instruction]]
name = "read.sr"
example = "0c 9c 10 06"
size = 4
confidence = "causal"

[instruction.fields.dest]
expr = "byte0[7:4]"
confidence = "causal"
note = "0c/1c/2c/3c observed as r0..r3."

[instruction.fields.sr]
expr = "byte1"
confidence = "causal"
note = "0x9c/0x9d/0x9e = threadgroup_position x/y/z; 0x9e predicted by extrapolation, then confirmed."

[[instruction]]
name = "load.indexed"
example = "0f 04 03 08 18 22 10 c0 41 00 80 00 00 00"
size = 14
confidence = "causal"

[instruction.fields.index_reg]
expr = "byte3 / 2"
confidence = "causal"
note = """r0..r4 seen as 0x00,0x02,0x04,0x06,0x08; the r4 case was preregistered. Now CAUSALLY
validated by retargeting: a load's index register moved to r2, r4 and r5 loads pad1[7], pad1[57]
and pad1[16] respectively, each preregistered and exact, with the buffer seeded so every value
names its own index."""

[instruction.fields.length]
expr = "byte7[7]"
confidence = "structural"
note = """Across three sites byte7=0xc0 accompanies a 14-byte encoding and byte7=0x40 an 8-byte
one. Three sites is not a length rule; recorded as an observation, not claimed."""

[instruction.fields.const_off]
expr = "not encoded in the instruction"
confidence = "structural"
note = "in[0], in[1], in[2] compile identically: a constant index folds into the buffer descriptor."

[[instruction]]
name = "store.device"
example = "0f 00 03 00 01 04 10 20"
size = 8
confidence = "structural"

[instruction.fields.src]
expr = "byte0[7:4]"
confidence = "causal"
note = """First source register. A store writes N CONSECUTIVE registers to N consecutive slots,
which is why a kernel with eight scalar stores emits only three instructions. Setting byte0[7:4]
to 0 on a 4-component store made out[100..103] read r0,r1,r2,r3 exactly as preregistered."""

[instruction.fields.components]
expr = "byte4[6:5]: 1->{k,k+1}, 2->{k,k+1,k+2}, 3->{k..k+3}, 0->{k, k+3} - a MASK, not a count"
confidence = "causal"
note = """CORRECTED 2026-09-04 by executing a compiler-generated store, and the correction is only
visible to an encoder that asks for something Apple's compiler never emits.

The old reading - a count, 0->1, 1->2, 2->3, 3->4, writing r<src>..r<src+n-1> to k..k+n-1 - is
EXACTLY RIGHT for 1, 2 and 3. It is wrong for 0, which does NOT write a single slot:

    byte4[6:5]=0   slot k <- r<src>   AND   slot k+3 <- r<src+1>

Measured by dispatching generated programs: a no-store control writes nothing at all, so the store
causes both; the slot sweep k in {6,7,8,9,12,16,20,33} writes k and k+3 every time; and the source
sweep, reading the physical register map back out of the emitted movimms, gives 4 of 4 -
src=r0 -> k+3 <- r1, src=r2 -> r3, src=r5 -> r6, src=r9 -> r10.

So the field selects WHICH COMPONENTS are written, and 0 selects components 0 and 3. THERE IS NO
ENCODING THAT WRITES A SINGLE SLOT: every value writes at least two. A backend storing one value
must reserve a second slot or place a known value in r<src+1>.

Apple's compiler emits 4-component stores for 4-value groups and never asks for the case that
exposes this, which is why decoding could not have found it.
ledger/g17-store-has-no-single-slot-form.toml"""

[instruction.fields.slot]
expr = "2*byte7[6:0] + byte6[7]"
confidence = "causal"
note = """Destination element index. Validated by moving a store to slots 111, 112, 114, 118 and
126 in the compiler's own output, then by authoring stores to 116..121 and 125."""

[instruction.fields.subform]
expr = "byte5[3]"
confidence = "context-dependent"
note = """byte5 = 0x0c on multi-capable stores, 0x04 on the single-component form the compiler
emits for a lone value. THE 0x04 SUB-FORM REJECTS ANY SOURCE CHANGE: sixteen values of
byte0[7:4] there produced no write at all, while the same sweep on a 0x0c store re-sourced it
correctly. Not understood; tools/g17asm.py refuses to author from a 0x04 template rather than
emit an instruction that silently stores nothing."""

[[instruction]]
name = "end"
example = "0e 00 00 00"
size = 4
confidence = "causal"


# ---------------------------------------------------------------------------------------
# Strength-reduced multiply form: `dest = src1 * m`, emitted for grid/index scaling.
# The MULTIPLIER IS ENUMERATED, not decoded - byte10 selects among several operations and
# which of its bits carry a shift amount versus an add-back selector is unresolved. Measured
# by authoring each value and reading the multiplier off self-identifying addresses.
[[instruction]]
name = "alu.mul.strength_reduced"
example = "37 04 04 1a 29 00 a3 02 08 80 05 00"
size = 12
confidence = "causal"

[instruction.fields.multiplier]
expr = "enumerated over byte10"
confidence = "causal"
note = """byte10 -> m: 0x00/0x08 -> 17, 0x01/0x09 -> 2, 0x04/0x0c -> 3, 0x05/0x0d -> 5,
0x0a/0x0b/0x0e/0x0f -> 1. byte10 in {0x02,0x03,0x06,0x07} is NOT a multiply: it yields
src1 + 2^k with k = 23,19,20,21 respectively. byte10[3] is a don't-care for m in {17,2,3,5}.
Each value was authored and the resulting multiplier read off addresses seeded so every loaded
value names its own index, across four threadgroups. Do NOT extrapolate past 0x0f: byte10 bit7
changes the instruction length.

The compiler does not use one form for all strides - 3, 5 and 9 (2^k+1) get this shift-add
form while 7 and 11 get a different one - so a stride is a code pattern, not a single field.
An earlier hypothesis m = 2*byte10 - 5 fitted 3 and 5 and was falsified by 7, 9 and 11."""

# Comparison against an immediate, recovered 2026-09-03 by controlled differential compilation
# plus preregistered predictions on constants never sampled (6 of 6 exact).
[[instruction]]
name = "cmp.imm"
example = "07 02 20 0c 22 81 07 86 a6 c9 17 02"
size = 12
confidence = "causal"

[instruction.fields.imm]
expr = "byte7[6:1]<<1 | byte10[4] | byte6[4]<<7"
confidence = "causal"
note = """The 8-bit compared constant is scattered over three bytes, and every bit was confirmed
by varying the constant alone and observing which bytes move:
    imm[0]    -> byte10[4]      byte10 is 0x07 for an even constant, 0x17 for an odd one
    imm[6:1]  -> byte7[6:1]     byte7 = 0x80 | (imm & 0x7e); byte7[7] is always set
    imm[7]    -> byte6[4]       byte6 is 0x07 below 128, 0x17 at or above
Sampled at 0,1,2,3,7,15,16,23,31,32,63,64,71,127,128,255, then PREREGISTERED for 100, 45, 200,
111, 6 and 250 - all six predicted byte6, byte7 and byte10 exactly before compiling."""

# Bitwise mask against an immediate. This is the 4-BYTE class-3 form - the second half of the
# 6+4 pair that NOP coherence uncovered when it overturned the universal "class 3 = 10" rule.
# Recovered 2026-09-03 by controlled differential plus preregistered predictions (6 of 6 exact).
[[instruction]]
name = "mask.imm"
example = "a3 0a 02 8c"
size = 4
confidence = "causal"

[instruction.fields.imm]
expr = "((byte3 & 0x7f) << 2) | (byte2 >> 6)"
confidence = "causal"
note = """The mask constant is split across the last two bytes: its low 2 bits sit in byte2[7:6]
and the rest in byte3[6:0], with byte3[7] always set. AND and OR produce byte-identical
immediate encodings, so the operation is selected elsewhere in the pair.

Sampled at 1, 2, 5, 7, 8, 16, 24 and 31, then PREREGISTERED for 100, 45, 200, 63, 129 and 250 -
all six predicted both bytes exactly before compiling, and the inverse decode recovers each
constant."""

# CONTROL FLOW, the first branch recovered. A conditional backward branch: the loop-closing
# instruction of a while-loop. Found 2026-09-03 by differential compilation over 20 variants that
# grow the loop body without changing register pressure, then confirmed causally.
[[instruction]]
name = "branch.cond.back"
example = "de 6f f3 1e"
size = 4
confidence = "causal"
note = """Identified causally, not by pattern. In the Collatz kernel (x = n|3, count steps to 1,
