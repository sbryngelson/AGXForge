1384, and patching them individually into the K=64 kernel shows ONE that moves the result -
byte1 of this class-2 instruction. The other eight, including a 16-bit constant that also tracks
K, are inert with respect to the loop.
ledger/g17-k-loop-trip-count-authored.toml"""

[instruction.fields.trip]
expr = "byte1 = K + 96      (K = the matmul2d reduction depth; K >= 192 overflows the byte and the form changes)"
confidence = "causal"
note = """Verified on three compiled kernels - K=64 gives 0xa0, K=96 gives 0xc0, K=128 gives 0xe0 -
including K=96, an off-grid value that falsified an earlier linear fit to a different constant.

AUTHORED into a K=64 kernel, with the compiled kernel for that depth as the reference:

    byte1 0xc0   tile 131072   compiled K=96  gives 131072   preregistered, exact
    byte1 0xe0   tile 163840   compiled K=128 gives 163840

The observable is the accumulated tile, which follows 32768 * (1 + floor(K/32)) when the
accumulation control at +0x2c8 has byte2[0] clear. With that bit SET the tile is K-independent, so
the control must be cleared for this field to be visible at all."""

