# Authorability handoff: what the codegen peer needs per opcode, not just a name.
#
# Three categories, and the middle one exists because conflating it with the first produced a
# wrong answer on hardware. The encode side authored the 4-byte register-register bitwise form
# with zero unexplained bits and executed it; `and` returned the XOR of its operands, because
# the operation selector byte2[2:0] is CONSTANT within each opcode, never varies, never shows as
# unexplained, and was inherited from an xor template.
#
#   template-safe   no unexplained bits and no selector bits. Copying a template inherits no
#                   choice, because nothing distinguishes this opcode from its siblings.
#   selector-bound  no unexplained bits, but N bits are constant HERE and different in a sibling
#                   with the same operand signature and length. Those bits are semantic and must
#                   be WRITTEN, not copied.
#   blocked         bits that vary and correlate with no operand, under the slot model.
#
# Bits are correlated against SLOT-encoded register values, slot = hw*2 + half, as well as raw
# operand values. Correlating against MCRegister ids alone under-credits every register-bearing
# opcode: on op10282 the difference is 16 unexplained versus 6.
#
# POSITIVE CONTROL for the selector classifier: without being told, it recovers byte2[2:0] on the
# bitwise family - the field the encode side found causally when `and` returned an xor - and
# b9[7] with b8[3] on the add family, which are the operand-width bits that side recovered by
# execution. Two independently established fields, rediscovered structurally.
#
# Says nothing about what an instruction DOES. Generated by tools/g17layout.py.

[meta]
chip = "H17s"
arch = "applegpu_g17s"
objects_scanned = 1908
named = 193
template_safe = 32
selector_bound = 103
blocked = 2
unsolvable_here = 56

